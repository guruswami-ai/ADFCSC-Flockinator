; Flockinator workshop — combined ESP8266 sniffer + injector.
; Build & flash:  pio run -t upload    (serial monitor:  pio device monitor -b 115200)
[env:esp8266]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
build_flags = -Wall -Wextra
